# Spark logging for every session in the image (SPARK_CONF_DIR=/etc/spark).
# Off: JupyterLab shows Spark's log under each cell, and RumbleDB queries log
# warnings students can't act on. Failed queries still raise an exception with
# the error message.
rootLogger.level = off
# Spark ignores a config without an appender and falls back to its default (WARN)
rootLogger.appenderRef.stderr.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex
# The level for Python sessions; without it Spark prints "Setting default log level to WARN"
logger.repl.name = org.apache.spark.api.python.PythonGatewayServer
logger.repl.level = off
