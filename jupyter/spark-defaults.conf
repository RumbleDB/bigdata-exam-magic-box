# Spark defaults for every session in the image (SPARK_CONF_DIR=/etc/spark).
# Delta Lake: its classes are bundled in the RumbleDB jar, so these two settings
# are enough. 
spark.sql.extensions             io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog  org.apache.spark.sql.delta.catalog.DeltaCatalog

# No [Stage N:===>  ] progress bars under notebook cells
spark.ui.showConsoleProgress     false
