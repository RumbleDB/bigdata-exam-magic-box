[project]
name = "bigdata-exam-lab"
version = "0.1.0"
description = "Jupyter environment for the Big Data exam (Spark, JSONiq, SQL)"
requires-python = ">=3.11,<3.12"
[dependency-groups]
jsoniq = [
    # JSONiq / RumbleDB: supplies compatible PySpark, Delta Lake, and pandas.
    "jsoniq==3.0.3",
    # The extension supplies jupyterlab-lsp.
    "jsoniq-jupyterlab-extension==2.0.0",
]

base = [
    # Jupyter: JupyterLab supplies ipykernel.
    "jupyterlab==4.5.5",
    # uv environments have no pip; keep `!pip install` working in notebooks.
    "pip==26.3",

    # Spark
    "sparksql-magic==0.0.3",

    # SQL: JupySQL supplies jupysql-plugin.
    "jupysql==0.11.1",
    "psycopg2-binary==2.9.12",

    # Spark Connect dependencies imported by JupySQL.
    # grpcio-status supplies a compatible grpcio version.
    "pyarrow==26.0.1",
    "grpcio-status==1.74.0",
]

[tool.uv]
package = false
default-groups = ["base", "jsoniq"]
