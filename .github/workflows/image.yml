name: Build Jupyter image

# Every push to main that touches the image publishes:
#   :latest                 what students get by default
#   :2026.11.03-a1b2c3d     immutable version (date + commit), pin this for exams
# Every pull request (incl. Renovate's) builds and smoke-tests both architectures,
# without pushing, so the required checks always report.
#
# Each architecture builds natively on its own runner (no QEMU emulation),
# pushes by digest, and the `merge` job combines them into one multi-arch tag.

on:
  push:
    branches: [main]
    paths:
      - "jupyter/**"
      - "tests/**"
      - ".github/workflows/image.yml"
  pull_request:
  workflow_dispatch:

# Jobs request only the permissions they need
permissions: {}

# On main, runs queue so an older run can never move :latest back.
# On pull requests, a new push cancels the outdated run.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Computed once, so the tag and the version baked into the image (shown by
  # `exam-lab-versions`) are the same, even if the build runs past midnight.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=$(TZ=Europe/Zurich date +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64 # Apple Silicon students
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name and platform
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # The Dockerfile exports uv.lock with --frozen, which trusts the lock as is.
      # Fail here if pyproject.toml was edited without running `uv lock`.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check uv.lock matches pyproject.toml
        working-directory: jupyter
        run: uv lock --check

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=Big Data exam Jupyter
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: jupyter
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: IMAGE_VERSION=${{ needs.version.outputs.version }}
          load: true
          tags: exam-lab:test
          # Registry cache: unlike the Actions cache it never expires, so unchanged
          # layers keep their digests and students only download what changed.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }}

      # Nothing is pushed unless this passes, so :latest never moves to a broken image
      - name: Smoke test
        run: tests/run.sh exam-lab:test

      # Same build, served from the builder's cache; pushed untagged, by digest.
      # The `merge` job tags it.
      - id: build
        name: Push by digest
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: jupyter
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: IMAGE_VERSION=${{ needs.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # No provenance attestation: GHCR lists it as an extra "unknown/unknown" platform
          provenance: false
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Export digest
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.version }},enable={{is_default_branch}}

      - name: Create multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Word splitting is intended: one `-t` per tag, one argument per digest
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          { echo "### Published"; echo '```'; echo "$TAGS"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
