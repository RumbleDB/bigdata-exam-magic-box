name: Build Jupyter image

# Every push to main that touches the image publishes:
#   :latest                 what students get by default
#   :2026.11.03-a1b2c3d     immutable version (date + commit), pin this for exams
# Pull requests (incl. Renovate's) build and smoke-test both architectures, no push.
#
# Each architecture builds natively on its own runner (no QEMU emulation),
# pushes by digest, and the `merge` job combines them into one multi-arch tag.

on:
  push:
    branches: [main]
    paths:
      - "jupyter/**"
      - "tests/**"
      - ".github/workflows/image.yml"
      - ".env"
  pull_request:
    paths:
      - "jupyter/**"
      - "tests/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

jobs:
  # Computed once, so the tag and the version baked into the image (shown by
  # `exam-lab-versions`) are the same, even if the build runs past midnight.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=$(TZ=Europe/Zurich date +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64 # Apple Silicon students
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image name and platform
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # Students' docker-compose.yml pulls ghcr.io/<REPO from .env>. If the repo
      # moved but .env wasn't updated, they would silently stop getting updates.
      - name: Check .env REPO matches this repository
        run: |
          repo=$(sed -n 's/^REPO=//p' .env)
          if [ "ghcr.io/$repo" != "$IMAGE" ]; then
            echo "::error file=.env::REPO=$repo but this repository publishes $IMAGE. Update .env."
            exit 1
          fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=Big Data exam Jupyter
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: jupyter
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: IMAGE_VERSION=${{ needs.version.outputs.version }}
          load: true
          tags: exam-lab:test
          # Registry cache: unlike the Actions cache it never expires, so unchanged
          # layers keep their digests and students only download what changed.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }}

      # Nothing is pushed unless this passes, so :latest never moves to a broken image
      - name: Smoke test
        run: tests/run.sh exam-lab:test

      # Same build, served from the builder's cache; pushed untagged, by digest.
      # The `merge` job tags it.
      - id: build
        name: Push by digest
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: jupyter
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: IMAGE_VERSION=${{ needs.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # No provenance attestation: GHCR lists it as an extra "unknown/unknown" platform
          provenance: false
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.version }},enable={{is_default_branch}}

      - name: Create multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Word splitting is intended: one `-t` per tag, one argument per digest
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          { echo "### Published"; echo '```'; echo "$TAGS"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
