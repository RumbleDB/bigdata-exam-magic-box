name: Clean up old image versions

# Deletes leftovers in the GHCR package: replaced build caches, old attestations,
# and untagged images no tag points to. Images that a tag (latest, a version
# tag, buildcache-*) still needs are kept. Version tags are never deleted.

on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only list what would be deleted
        type: boolean
        default: true

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          # Skip anything from the last day: a running build pushes its images
          # untagged and only tags them at the end
          older-than: 1 day
          # Scheduled runs delete for real; manual runs default to a dry run
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
